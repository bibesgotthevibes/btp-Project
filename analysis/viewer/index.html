<style>
/* Layout: case-file reader. Sample index on the left, original report and model version as facing pages. */
:root {
  --bg: #eef2f3;
  --paper: #ffffff;
  --ink: #16212a;
  --muted: #5a6975;
  --rule: #d5dde2;
  --accent: #1d5c73;
  --accent-soft: #e1eef2;
  --ok: #2d7a4c;
  --warn: #9a6200;
  --bad: #b02a1f;
  --mark: #fde9a8;
  --mark-ink: #16212a;
  --font-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1519; --paper: #172027; --ink: #e3eaee; --muted: #93a3ae; --rule: #2a3741;
    --accent: #7fc1d8; --accent-soft: #1d3440; --ok: #6cc592; --warn: #e2b04a; --bad: #f08a80;
    --mark: #6b5a17; --mark-ink: #fff6d6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1519; --paper: #172027; --ink: #e3eaee; --muted: #93a3ae; --rule: #2a3741;
  --accent: #7fc1d8; --accent-soft: #1d3440; --ok: #6cc592; --warn: #e2b04a; --bad: #f08a80;
  --mark: #6b5a17; --mark-ink: #fff6d6; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); }
.wrap { padding-inline: 16px; padding-block: 18px 40px; max-width: 1500px; margin: 0 auto; display: grid; gap: 16px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font: 600 1.55rem/1.2 var(--font-doc); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg button { font: 500 .85rem var(--font-ui); color: var(--muted); background: none; border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.search { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 8px; }
.search input { font: .9rem var(--font-ui); color: var(--ink); background: none; border: 0; outline: none; width: 13rem; max-width: 50vw; }
.search button { font: .8rem var(--font-ui); color: var(--muted); background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rule); vertical-align: 0; }
.dot.ok { background: var(--ok); } .dot.leak, .dot.echo { background: var(--bad); } .dot.cut { background: var(--warn); }
.dot.missing { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
nav.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; }
.group h2 { font: 600 .72rem var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 8px; }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 0; background: none; color: var(--ink); cursor: pointer; font: .88rem var(--font-ui); }
.item:hover { background: var(--paper); }
.item[aria-current="true"] { background: var(--paper); box-shadow: inset 3px 0 0 var(--accent); }
.item .id { font: 500 .85rem var(--font-data); }
.item .dots { display: inline-flex; gap: 3px; }
.mobile-pick { display: none; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.head h2 { margin: 0; font: 600 1.25rem/1.25 var(--font-doc); }
.head .kind { font: 500 .78rem var(--font-data); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.pager { display: inline-flex; gap: 6px; }
.pager button { font: .85rem var(--font-ui); background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

.facing { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.page { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; display: grid; }
.page-top { padding: 12px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.page-label { font: 600 .72rem var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.doc { padding: 16px 18px 20px; font: 1.02rem/1.62 var(--font-doc); max-height: 72vh; overflow-y: auto; }
.doc p { margin: 0 0 .85em; max-width: 68ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.doc.source p { font-size: .95rem; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 500 .83rem var(--font-ui); display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: none; color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: .8rem var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { font-weight: 500; color: var(--ink); }

.notice { margin: 12px 18px 0; padding: 9px 12px; border-radius: 8px; font-size: .88rem; border-left: 3px solid; }
.notice.leak, .notice.echo { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.notice.cut { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.notice.missing { border-color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); }
.notice.sub { border-color: var(--accent); background: var(--accent-soft); }

.checklist { border-top: 1px solid var(--rule); padding: 12px 18px 16px; display: grid; gap: 8px; }
.checklist h3 { margin: 0; font: 600 .78rem var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.checklist p { margin: 0; font-size: .82rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: .78rem var(--font-ui); border-radius: 5px; padding: 3px 7px; border: 1px solid var(--rule); background: none; color: var(--ink); cursor: pointer; max-width: 100%; text-align: left; overflow-wrap: anywhere; }
.chip.miss { border-color: color-mix(in srgb, var(--bad) 55%, var(--rule)); color: var(--bad); }
.chip.hit::before { content: "✓ "; color: var(--ok); }
.chip.miss::before { content: "✗ "; }

.compare { overflow-x: auto; padding-bottom: 6px; }
.compare-grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 12px; min-width: 0; }
.compare .doc { max-height: 78vh; font-size: .95rem; }
.empty { padding: 18px; color: var(--muted); }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.index { display: none; }
  .mobile-pick { display: block; }
  .mobile-pick select { width: 100%; font: .95rem var(--font-ui); padding: 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
  .facing { grid-template-columns: minmax(0, 1fr); }
  .doc { max-height: none; }
}
@media (prefers-reduced-motion: no-preference) { .item, .tab, .chip { transition: background-color .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Simplification Reader</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Prompt strategy">
        <button type="button" data-strategy="ner-guided" aria-pressed="true">NER-guided</button>
        <button type="button" data-strategy="zero-shot" aria-pressed="false">Zero-shot</button>
      </div>
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-view="facing" aria-pressed="true">One model</button>
        <button type="button" data-view="compare" aria-pressed="false">All models</button>
      </div>
      <label class="search" for="q">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Highlight a term, e.g. vancomycin" autocomplete="off">
        <button type="button" id="clearq" aria-label="Clear highlight">clear</button>
      </label>
    </div>
  </header>

  <div class="legend" aria-label="Output status legend">
    <span><span class="dot ok"></span> usable simplification</span>
    <span><span class="dot cut"></span> cut off / incomplete</span>
    <span><span class="dot leak"></span> not a simplification (model reasoning or copied prompt)</span>
    <span><span class="dot missing"></span> no output (quota or error)</span>
  </div>

  <div class="layout">
    <nav class="index" id="index" aria-label="Reports"></nav>
    <main id="main" style="display:grid;gap:14px;min-width:0">
      <div class="mobile-pick"><label for="pick" class="page-label">Report</label><select id="pick"></select></div>
      <div class="head">
        <div><div class="kind" id="kind"></div><h2 id="title"></h2></div>
        <div class="pager"><button type="button" id="prev">← Previous</button><button type="button" id="next">Next →</button></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
</div>

les on both sides with locotypical structure. No inflammation or atypia.\n\nTumor blocks for extra examinations: 4A, 4C, 4Z2.\n\nAssessment:\n1st-5th prostatectomy specimen with bilateral infiltrates of acinar adenocarcinoma, perineural sheath infiltration. Tumor-free apical and basal sedimentation lines. Tumor-free seminal vesicles on both sides. Tumor-free ductus deferens deposits on both sides. Residual prostate with adenomyomatosis.\n\nTNM classification (Prostate 2017, 8th edition): pT2c, pN0 (0/12 taking into account parallel submission), L0, V0, Pn1, R0;\n\nGleason score: 4 + 3 = 7b (60%4 proportion, 40%3 proportion).\n\nGleason pattern Gleason score ISUP graduation group Applies\n= 3 + 3 = 6 1\n3 + 4 7a 2\n4 + 3 7b 3 X\n4 + 4 8 4\n4 + 5, 5 + 4, 5 + 5 9-10 5\n\n\nICD-O-3 Explanation Applies\n8140/3 Adenocarcinoma n.d. X\n8020/3 Undifferentiated carcinoma n.a.\n\nWe will carry out additional examinations for verification and report back.", "outputs": [{"model": "gemini/3.8flash", "name": "Gemini 3.8 Flash", "ranOn": "gemini-2.5-flash", "strategy": "ner-guided", "entities": true, "state": "ok", "error": "", "text": "This report describes your prostate, which was removed during surgery (a radical prostatectomy). The removed prostate weighed 50.0 grams and measured 5.1 by 4.3 by 3.2 centimeters. Along with the prostate, the two seminal vesicles (small glands that help make semen) and the tubes called ductus deferentes (also known as vas deferens, which carry sperm) were also removed.\n\nThe main finding from looking at the tissue under the microscope is acinar adenocarcinoma (a type of cancer that starts in the gland cells). This cancer was found on both sides of your prostate. The specific code for this type of cancer is 8140/3.\n\nThe cancer was graded using a system called the Gleason score. Your score is 4 + 3 = 7 (also noted as 7b). This means the cancer cells look moderately aggressive. The ISUP Grade Group is 3. About 60% of the cancer had the more aggressive pattern (Gleason pattern 4).\n\nThe cancer was found to be growing along some small nerves (this is called perineural invasion). However, it was not found to be growing into blood vessels or lymphatic channels (lymphovascular invasion was absent). The cancer did not grow outside the prostate capsule (extracapsular extension was absent), and it also did not spread into the seminal vesicles (seminal vesicle invasion was absent).\n\nThe surgery successfully removed all the visible cancer. This is called an R0 resection, meaning no cancer cells were found at the edges of the removed tissue (resection margins). Specifically, the right apical margin, left apical margin, right basal margin, left basal margin, right vas deferens margin, and left vas deferens margin were all negative, meaning no cancer cells were touching these edges.\n\nThe remaining prostate tissue also showed a condition called adenomyomatosis (a non-cancerous change where there's an overgrowth of glands and muscle tissue). Additional examinations for verification will be carried out, and you will receive an update.", "found": ["Prostate", "Radical prostatectomy", "50.0", "5.1 x 4.3 x 3.2", "ductus deferentes", "Acinar adenocarcinoma", "acinar", "4", "3", "7", "60%", "Residual prostate with adenomyomatosis", "Additional examinations for verification will be carried out"], "missed": ["bilateral dorsally attached seminal vesicles", "bilateral"], "words": 313, "fkgl": 9.75, "numbers": 0.241, "coverage": 0.818}, {"model": "gemini/3.1pro", "name": "Gemini 3.1 Pro", "ranOn": "gemini-2.5-flash", "strategy": "ner-guided", "entities": true, "state": "ok", "error": "", "text": "Your doctor removed your prostate gland (a small gland in men that helps make semen) during a surgery called a radical prostatectomy (which means the entire prostate gland was removed). The prostate weighed 50.0 grams and measured 5.1 by 4.3 by 3.2 centimeters. Also removed were the seminal vesicles (two small glands behind the prostate l on the scan, indicating inflammation. The same lining around the right ventricle, the third and fourth ventricles, and the narrow tube that connects them (the cerebral aqueduct) is also thickened, but it does not light up with dye. The fluid spaces themselves are still the normal size. There is swelling (edema) in the white matter of the parietal and back parts of the brain (the occipital lobes) that extends to the middle part of the brain (the corpus callosum). No bleeding was seen.\n\nOther areas that were checked outside the brain show mild inflammation. The lining inside the two lower sinuses in the cheekbones (maxillary sinuses), the small air cells in the forehead (frontal sinuses) and the cells between the eyes (ethmoidal cells) are a bit thickened, which is often due to a sinus infection. The right mastoid cells (air spaces behind the ear) also show a small amount of inflammation.\n\nBecause there are abscesses that have reached the brain’s fluid spaces, this is a serious situation that needs prompt treatment. Your doctor will discuss the next steps, which may include antibiotics, surgery to drain the abscesses, or other treatments. The other sinus and ear findings are usually treated with medications or sometimes a simple procedure. Your doctor will let you know exactly what to do next.", "found": [], "missed": [], "words": 491, "fkgl": 9.22, "numbers": 0.143, "coverage": 0.636}, {"model": "cerebras/qwen3.8", "name": "Qwen 3.8", "ranOn": null, "strategy": "ner-guided", "entities": true, "state": "ok", "error": "", "text": "You had a cranial MRI, which is a detailed brain scan using magnetic fields and radio waves without any radiation. To get the clearest picture, the doctors used several different types of images called sequences, including T1-weighted, FLAIR, T2-weighted, DWI, ADC, and SWI. They also injected a contrast dye called Dotarem to help highlight specific areas. The reason for this scan was to investigate your headache.\n\nFirst, it is good ne on restriction in the center", "Left parietal lobe, anterior periventricular", "Abscess measuring 18x8 mm opening into the ventricle, with walls showing contrast enhancement and diffusion restriction in the center", "Ependyma extending from occipital atrium to body of left lateral ventricle", "Contrast enhancement in the ependyma at the ventricle and opening site", "Ventricle and occipital horns of both ventricles", "Abscess foci showing diffusion restriction within the ventricle and in the occipital horns of both ventricles", "Walls of right lateral ventricle, 3rd and 4th ventricles, and cerebral aqueduct", "Thickening and signal increase not showing contrast enhancement in the ependyma", "White matter of parietal and occipital lobes", "Vasogenic edema extending to the corpus callosum", "Bilateral maxillary sinuses, ethmoidal cells, and frontal sinuses", "Mucosal thickening", "Right mastoid cells", "Minimal inflammatory signal increases", "Posterior left parietal abscess", "20x18", "Anterior left parietal abscess", "18x8", "Cerebral abscesses in the left parietal lobe, posterior periventricular location, opening into the ventricle, ventriculitis. Mucosal thickening in the bilateral maxillary sinuses, ethmoidal cells, and frontal sinuses. Minimal inflammatory signal increases in the right mastoid cells."], "missed": [], "words": 631, "fkgl": 12.28, "numbers": 0.857, "coverage": 1.0}, {"model": "cerebras/qwen3.8", "name": "Qwen 3.8", "ranOn": null, "strategy": "zero-shot", "entities": false, "state": "ok", "error": "", "text": "This report is from a brain MRI, which is a detailed scan of the brain using magnetic fields and radio waves, without any radiation. The scan was performed to investigate your headache. The radiologist used special techniques and a contrast dye to get a very clear picture of the brain's structure and blood flow.\n\nFirst, it is important to know that many parts of your head and brain are healthy. The bones of your skull, your eyes, the fat behind your eyes, and the optic nerves (the cables that carry vision from your eyes to your brain) are all normal. The main blood vessels in your brain are open and working correctly. Additionally, the basal ganglia (deep brain areas involved in movement), thalamus (a relay station for sensory signals), brainstem (the part connecting the brain to the spine), and cerebellum (the part of the brain that controls balance and coordination) all appear normal. There is no bleeding in the brain, and the overall size of the fluid-filled spaces in the brain is normal.\n\nHowever, the scan did find some serious issues that need attention. There are brain abscesses, which are pockets of infection and pus, located in the left parietal lobe (the part of the brain that helps process touch and spatial awareness). These abscesses are near the fluid-filled spaces in the brain called ventricles. One of these abscesses is about the size of a small grape, and another is smaller. The walls of these abscesses light up with the contrast dye, which confirms they are active infections. More importantly, the infection has spread into the ventricles themselves. This condition is called ventriculitis, which means the lining of the fluid spaces in the brain is inflamed and infected. The scan shows signs of this inflammation in the left side and also some thickening of the lining in the right side and deeper parts of the brain.\n\nBecause of this infection, there is swelling in the brain tissue around the abscesses. This swelling, called vasogenic edema, has spread into the white matter (the communication pathways of the brain) of the parietal and occipital lobes (the back part of the brain involved in vision) and even into the corpus callosum (the bridge of nerve fibers connecting the left and right sides of the brain). This swelling is a reaction to the infection and is not a separate disease.\n\nThe report also notes some minor issues in the sinuses, which are the air-filled spaces in your face a     }
    if (o.ranOn) frag.append(el("div", "notice sub", `Labelled ${o.name}, but this output was produced by ${o.ranOn} (the requested model was over quota).`));
    if (o.strategy === "ner-guided" && !o.entities && o.state !== "missing") {
      frag.append(el("div", "notice sub", "The entity-extraction step failed for this run, so the model used the plain zero-shot prompt without an entity list."));
    }
    return frag;
  }

  function checklist(o) {
    if (!o.entities || (!o.found.length && !o.missed.length)) return null;
    const box = el("div", "checklist");
    box.append(el("h3", null, `Extracted entities · ${o.found.length} kept, ${o.missed.length} not found`));
    box.append(el("p", null, "Entities this model extracted in step 1 and was told to keep. Click one to highlight it in both texts. Matching is automatic, so check misses by eye."));
    const chips = el("div", "chips");
    for (const e of o.missed) chips.append(chip(e, "miss"));
    for (const e of o.found) chips.append(chip(e, "hit"));
    box.append(chips);
    return box;
  }
  function chip(text, cls) {
    const c = el("button", "chip " + cls, text.length > 70 ? text.slice(0, 68) + "…" : text);
    c.type = "button"; c.title = text;
    c.addEventListener("click", () => { $("q").value = text; state.q = text; render(); });
    return c;
  }

  function outputPage(o, withTabs, outs) {
    const page = el("section", "page");
    const top = el("div", "page-top");
    if (withTabs) {
      const tabs = el("div", "tabs"); tabs.setAttribute("role", "tablist");
      for (const x of outs) {
        const t = el("button", "tab"); t.type = "button"; t.setAttribute("role", "tab");
        t.setAttribute("aria-selected", x === o ? "true" : "false");
        t.append(el("span", "dot " + x.state), document.createTextNode(x.name));
        t.addEventListener("click", () => { state.model = x.model; store.set("model", x.model); render(); });
        tabs.append(t);
      }
      top.append(el("div", "page-label", "Simplified version"), tabs);
    } else {
      const lab = el("div", "page-label"); lab.append(el("span", "dot " + o.state), document.createTextNode(" " + o.name));
      top.append(lab);
    }
    top.append(metaLine(o));
    page.append(top, notices(o));
    const doc = el("div");
    if (o.state === "missing") { doc.className = "doc"; doc.append(el("p", "empty", "Nothing was generated.")); }
    else renderText(doc, o.text);
    page.append(doc);
    const cl = checklist(o); if (cl) page.append(cl);
    return page;
  }

  function sourcePage(s) {
    const page = el("section", "page");
    const top = el("div", "page-top");
    top.append(el("div", "page-label", "Original report"));
    const m = el("div", "meta"); const w = el("span"); w.append("words "); w.append(el("b", null, String(s.source.split(/\s+/).filter(Boolean).length))); m.append(w);
    top.append(m);
    const doc = el("div"); renderText(doc, s.source, "source");
    page.append(top, doc);
    return page;
  }

  function render() {
    const s = DATA[state.idx];
    $("kind").textContent = `${s.id} · ${TYPE_LABEL[s.type]}`;
    $("title").textContent = s.title;
    document.querySelectorAll("[data-strategy]").forEach(b => b.setAttribute("aria-pressed", b.dataset.strategy === state.strategy ? "true" : "false"));
    document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view ? "true" : "false"));
    renderIndex();

    const view = $("view"); view.replaceChildren();
    const outs = outputsFor(s);
    if (!outs.length) {
      const f = el("div", "facing"); f.append(sourcePage(s));
      const p = el("section", "page"); p.append(el("p", "empty", "No outputs for this report with this prompt."));
      f.append(p); view.append(f); return;
    }
    if (state.view === "compare") {
      const wrap = el("div", "compare"); const grid = el("div", "compare-grid");
      grid.append(sourcePage(s));
      for (const o of outs) grid.append(outputPage(o, false));
      wrap.append(grid); view.append(wrap);
    } else {
      const chosen = outs.find(o => o.model === state.model) || outs.find(o => o.state === "ok") || outs[0];
      const f = el("div", "facing");
      f.append(sourcePage(s), outputPage(chosen, true, outs));
      view.append(f);
    }
  }

  function go(i) {
    state.idx = (i + DATA.length) % DATA.length;
    history.replaceState(null, "", "#" + DATA[state.idx].id);
    render();
  }

  document.querySelectorAll("[data-strategy]").forEach(b => b.addEventListener("click", () => { state.strategy = b.dataset.strategy; store.set("strategy", state.strategy); render(); }));
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; store.set("view", state.view); render(); }));
  $("prev").addEventListener("click", () => go(state.idx - 1));
  $("next").addEventListener("click", () => go(state.idx + 1));
  $("pick").addEventListener("change", e => go(Number(e.target.value)));
  let t;
  $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 150); });
  $("clearq").addEventListener("click", () => { $("q").value = ""; state.q = ""; render(); });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, select")) return;
    if (e.key === "ArrowRight" || e.key === "j") go(state.idx + 1);
    if (e.key === "ArrowLeft" || e.key === "k") go(state.idx - 1);
  });
  render();
})();
</script>
