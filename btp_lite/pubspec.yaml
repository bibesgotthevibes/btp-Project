name: btp_lite
description: MedSimplify Lite — medical discharge summary simplifier for mobile & web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP
  http: ^1.2.1
  # Local storage for API keys + history
  shared_preferences: ^2.3.2
  # Markdown rendering for LLM output
  flutter_markdown: ^0.7.4
  # PDF export
  pdf: ^3.11.1
  printing: ^5.13.2
  # Share output
  share_plus: ^10.0.0
  # File picker for discharge summary upload
  file_picker: ^8.0.0
  # Animations
  flutter_animate: ^4.5.0
  # Google Fonts
  google_fonts: ^6.2.1
  # State management
  provider: ^6.1.2
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
